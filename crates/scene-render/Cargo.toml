[package]
name = "scene-render"
description = "scene-render command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "scene-render"
path = "src/main.rs"

[features]
default = ["pdf"]
# `scene-render resolve` for pdf assets (SREP 17; needs Rust 1.92). Without it the binary builds on Rust 1.90 and
# reports pdf assets in `resolve` as errors; rendering them from their pinned caches needs no feature.
pdf = ["sr-resolve/pdf"]

[dependencies]
sr-3d = { path = "../sr-3d" }
sr-model.workspace = true
sr-eval.workspace = true
sr-volume.workspace = true
sr-gpu.workspace = true
sr-vector.workspace = true
sr-media.workspace = true
sr-deliver.workspace = true
sr-resolve.workspace = true
image.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
anstream.workspace = true
anstyle.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
image.workspace = true

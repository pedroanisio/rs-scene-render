[package]
name = "sr-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "3D assets for scene-render: model import (glTF, OBJ, PLY, FBX, USD, splats), primitives, animation, lights, environments, cameras"

[dependencies]
sr-media.workspace = true
glam = { version = "0.30", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras", "extensions", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_volume", "KHR_materials_specular", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_materials_variants", "KHR_texture_transform", "KHR_lights_punctual"] }
tobj = { version = "4", default-features = false }
lyon_tessellation = "1"
ufbx = "0.11"
image = { workspace = true, features = ["hdr", "exr"] }
roxmltree.workspace = true
serde_json.workspace = true
half.workspace = true
bytemuck.workspace = true
sr-vector = { path = "../sr-vector" }

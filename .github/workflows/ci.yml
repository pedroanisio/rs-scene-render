name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}
env:
  SR_GPU_BACKEND: vulkan
  CARGO_BUILD_JOBS: 2
jobs:
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo check --workspace --all-targets --locked
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: python3 tools/check_release_hygiene.py --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features scene-render/pdf -- -D warnings
      - run: cargo test --workspace --exclude sr-eval --exclude sr-sim --exclude sr-gpu --features scene-render/pdf --locked --no-fail-fast -- --test-threads=1
      - run: python3 -m unittest discover -s tools/tests -v
        if: always()
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-diagnostics
          path: |
            target/environment/
            target/golden-output/
          if-no-files-found: warn
  gpu-test:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: python3 tools/gpu_shards.py ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gpu-test-diagnostics-${{ matrix.shard }}
          path: |
            target/environment/
            target/golden-output/
          if-no-files-found: warn
  cpu-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: cargo test --locked -p sr-eval -p sr-sim --no-fail-fast -- --test-threads=2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cpu-test-diagnostics
          path: target/environment/
          if-no-files-found: warn
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # the shipped binary carries the PDF resolve step (SREP 17), whose PDF library needs Rust 1.92 or later
      - name: Check the toolchain for the pdf feature
        run: |
          v=$(rustc --version | awk '{print $2}')
          test "$(printf '%s\n1.92.0\n' "$v" | sort -V | head -1)" = 1.92.0 || { echo "rustc $v is older than 1.92"; exit 1; }
      - run: cargo build --locked --release -p scene-render -p sr-fuzz --features scene-render/pdf
      - run: python3 tools/evidence.py target/evidence
      - run: python3 tools/evidence.py target/review --manifest tools/evidence/review.json --clips
        if: success() || failure()
      - name: Record validated tools
        if: success()
        run: |
          mkdir -p target/release-artifact
          cp target/release/scene-render target/release/sr-fuzz target/release-artifact/
          git rev-parse HEAD > target/release-artifact/COMMIT
          (cd target/release-artifact && sha256sum scene-render sr-fuzz > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: validated-linux-tools
          path: target/release-artifact/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visual-evidence
          path: |
            target/environment/
            target/evidence/
            target/review/
          if-no-files-found: warn
  performance-gate:
    # the renderer before and after this change, benched alternately on the same runner:
    # a fixture more than 15% slower fails (tools/perf_gate.py)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: base
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.ref_type }}" = tag ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              base="$(git rev-parse HEAD^)"
            fi
          fi
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          else
            echo "no base commit to compare against"
          fi
      - if: steps.base.outputs.sha
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
          cargo build --locked --release -p scene-render
          (cd "$RUNNER_TEMP/base" && cargo build --locked --release -p scene-render)
      - if: steps.base.outputs.sha
        run: python3 tools/perf_gate.py "$RUNNER_TEMP/base/target/release/scene-render" target/release/scene-render --json target/perf-gate.json
      - if: always() && steps.base.outputs.sha
        uses: actions/upload-artifact@v6
        with:
          name: performance-gate
          path: target/perf-gate.json
          if-no-files-found: warn
  performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: cargo test --release --test perf
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-rust-environment
          path: target/environment/
          if-no-files-found: warn
  performance-smoke:
    needs: evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/runtime
      - uses: actions/download-artifact@v7
        with:
          name: validated-linux-tools
          path: target/release
      - name: Verify validated tools
        run: |
          test "$(cat target/release/COMMIT)" = "$GITHUB_SHA"
          (cd target/release && sha256sum -c SHA256SUMS)
          chmod +x target/release/scene-render target/release/sr-fuzz
      - run: target/release/scene-render eval tests/corpus/valid/kitchen-sink.scene.xml --bench
      # smoke run: three transformed, feathered-mask image layers, rendered for a few frames
      - run: python3 tools/perf_layers.py /tmp/perf_layers && target/release/scene-render render /tmp/perf_layers/perf_layers.scene.xml --bench --frames 0..3
      # smoke run: four decoded 1080p60 layers, mixed audio, H.264 + AAC
      - run: python3 tools/perf_video.py /tmp/perf_video --duration 1 && target/release/scene-render encode /tmp/perf_video/perf_video.scene.xml --hw software --end 0.25
      - run: ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/perf_video/perf_video.mp4 | grep -qx h264
      # smoke run: 2,000 stroked shapes with trim paths and a 30-bone skinned rig
      - run: python3 tools/perf_vector.py /tmp/perf_vector --duration 1 && target/release/scene-render encode /tmp/perf_vector/perf_vector.scene.xml --hw software --end 0.1
      - run: ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/perf_vector/perf_vector.mp4 | grep -qx h264
      # smoke run: animated text layers and a karaoke caption track, H.264
      - run: python3 tools/perf_text.py /tmp/perf_text --duration 1 && target/release/scene-render encode /tmp/perf_text/perf_text.scene.xml --hw software --end 0.1
      - run: ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/perf_text/perf_text.mp4 | grep -qx h264
      # smoke run: 8 effects, a transition and 16-sample motion blur on two moving layers
      - run: python3 tools/perf_effects.py /tmp/perf_effects --duration 1 && target/release/scene-render render /tmp/perf_effects/perf_effects.scene.xml --bench --frames 0..4
      # smoke run: 207,936 triangles, 4 shadowed spot lights, transmission and depth of field at 1080p
      - run: python3 tools/perf_3d.py /tmp/perf_3d --duration 1 && target/release/scene-render render /tmp/perf_3d/perf_3d.scene.xml --bench --frames 0..4
      # smoke run: 200 rigid bodies, two soft bodies and three emitters at 1080p
      - run: python3 tools/perf_physics.py /tmp/perf_physics --duration 2 && target/release/scene-render render /tmp/perf_physics/perf_physics.scene.xml --bench --frames 60..64
      # 10-minute smoke run of the parser, evaluator and expression compiler; the fuzzer accepts a longer --seconds for extended runs
      - run: target/release/sr-fuzz --seconds 600
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-environment
          path: |
            target/environment/
            /tmp/perf_*/*.scene.xml
            fuzz-crashes/
          if-no-files-found: warn
  oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: python3 tools/build_corpus.py && git diff --exit-code tests/corpus
      - run: cargo build --release && python3 tools/oracle_diff.py 2000 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: oracle-environment
          path: |
            target/environment/
            target/oracle*/
          if-no-files-found: warn
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test -p sr-model -p sr-eval -p sr-resolve --lib --locked

name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # GPU tests run on Mesa lavapipe, the software Vulkan driver the goldens were made with
      SR_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_release_hygiene.py --all
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # FFmpeg decodes and encodes media; curl delivers to destinations
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 ffmpeg curl fonts-dejavu-core fonts-dejavu-extra fonts-noto-color-emoji fonts-wqy-zenhei
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --release --test perf
      - run: cargo build --release && target/release/scene-render eval tests/corpus/valid/kitchen-sink.scene.xml --bench
      # smoke run: three transformed, feathered-mask image layers, rendered for a few frames
      - run: python3 tools/perf_layers.py /tmp/perf_layers && target/release/scene-render render /tmp/perf_layers/perf_layers.scene.xml --bench --frames 0..3
      # smoke run: four decoded 1080p60 layers, mixed audio, H.264 + AAC
      - run: python3 tools/perf_video.py /tmp/perf_video --duration 1 && target/release/scene-render encode /tmp/perf_video/perf_video.scene.xml --hw software --end 0.25
      - run: ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/perf_video/perf_video.mp4 | grep -qx h264
      # smoke run: 2,000 stroked shapes with trim paths and a 30-bone skinned rig
      - run: python3 tools/perf_vector.py /tmp/perf_vector --duration 1 && target/release/scene-render encode /tmp/perf_vector/perf_vector.scene.xml --hw software --end 0.1
      - run: ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/perf_vector/perf_vector.mp4 | grep -qx h264
      # smoke run: animated text layers and a karaoke caption track, H.264
      - run: python3 tools/perf_text.py /tmp/perf_text --duration 1 && target/release/scene-render encode /tmp/perf_text/perf_text.scene.xml --hw software --end 0.1
      - run: ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/perf_text/perf_text.mp4 | grep -qx h264
      # smoke run: 8 effects, a transition and 16-sample motion blur on two moving layers
      - run: python3 tools/perf_effects.py /tmp/perf_effects --duration 1 && target/release/scene-render render /tmp/perf_effects/perf_effects.scene.xml --bench --frames 0..4
      # smoke run: 207,936 triangles, 4 shadowed spot lights, transmission and depth of field at 1080p
      - run: python3 tools/perf_3d.py /tmp/perf_3d --duration 1 && target/release/scene-render render /tmp/perf_3d/perf_3d.scene.xml --bench --frames 0..4
      # smoke run: 200 rigid bodies, two soft bodies and three emitters at 1080p
      - run: python3 tools/perf_physics.py /tmp/perf_physics --duration 2 && target/release/scene-render render /tmp/perf_physics/perf_physics.scene.xml --bench --frames 60..64
      # 10-minute smoke run of the parser, evaluator and expression compiler; the fuzzer accepts a longer --seconds for extended runs
      - run: cargo run --release -p sr-fuzz -- --seconds 600
      - run: pip install lxml
      - run: python3 tools/build_corpus.py && git diff --exit-code tests/corpus
      - run: cargo build --release && python3 tools/oracle_diff.py 2000 1

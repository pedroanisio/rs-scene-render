[workspace]
members = ["crates/sr-model", "crates/sr-eval", "crates/sr-gpu", "crates/sr-media", "crates/sr-audio", "crates/sr-deliver", "crates/sr-vector", "crates/sr-text", "crates/sr-3d", "crates/sr-sim", "crates/sr-volume", "crates/sr-geo", "crates/sr-resolve", "crates/sr-fuzz", "crates/scene-render"]
resolver = "2"
# vendored crates are dependencies, not members (see vendor/README.md)
exclude = ["vendor"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/pedroanisio/rs-scene-render"
publish = false

[workspace.dependencies]
sr-model = { path = "crates/sr-model" }
sr-eval = { path = "crates/sr-eval" }
libm = "0.2"
sr-gpu = { path = "crates/sr-gpu" }
sr-media = { path = "crates/sr-media" }
sr-geo = { path = "crates/sr-geo" }
sr-resolve = { path = "crates/sr-resolve" }
sr-audio = { path = "crates/sr-audio" }
sr-deliver = { path = "crates/sr-deliver" }
sr-vector = { path = "crates/sr-vector" }
sr-text = { path = "crates/sr-text" }
sr-volume = { path = "crates/sr-volume" }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp", "tga", "qoi", "pnm", "ico", "hdr", "exr", "dds", "ff"] }
roxmltree = "0.20"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
anstream = "0.6"
anstyle = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
opt-level = 1

# gpu-allocator with one change, for wgpu's Vulkan backend: upload memory in ordinary host memory instead
# of the device's mapped-memory window (see vendor/README.md).
[patch.crates-io]
gpu-allocator = { path = "vendor/gpu-allocator" }
